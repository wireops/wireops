name: Quality (Codacy)

env:
  GO_VERSION: "1.27.3"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  codacy:
    name: Codacy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Codacy Analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          upload: true

  coverage:
    name: Codacy Coverage
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests with coverage
        env:
          CGO_ENABLED: 0
        run: |
          packages=$(go list ./... | grep -v '^github.com/wireops/wireops/worker\(/\|$\)')
          go test -timeout 20m -coverprofile=coverage.out $packages

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: coverage.out
          force-coverage-parser: go

  frontend-coverage:
    name: Codacy Coverage (Frontend)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Runs after the backend coverage job on purpose, even though the two have
    # nothing to do with each other. codacy-coverage-reporter-action always
    # uploads its report with --partial and then always sends the "final"
    # notification, with no input to suppress either (see its action.yml), so
    # two independent jobs finalize the same commit twice. Whichever finishes
    # first decides the coverage Codacy computes, and the other then
    # re-finalizes on top of it: the backend job takes ~11 minutes and the
    # frontend one ~1, so the project figure flipped between "frontend only"
    # and "both", and the coverage-variation gate compared a PR measured one
    # way against a base measured the other (it reported -21% for a branch
    # that locally raises total coverage by 0.4 points). Serializing makes the
    # order deterministic and identical on main and on pull requests.
    needs: coverage
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Run postinstall scripts
        working-directory: ./frontend
        run: npm run postinstall

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1
        with:
          api-token: ${{ secrets.CODACY_API_TOKEN }}
          coverage-reports: frontend/coverage/lcov.info
