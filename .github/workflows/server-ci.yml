name: Server CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: "1.25.12"

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-server-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-server-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run server/backend tests
        env:
          CGO_ENABLED: 0
        run: |
          packages=$(go list ./... | grep -v '^github.com/wireops/wireops/worker\(/\|$\)')
          go test -v $packages

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: |
          # GO-2026-5668/5617/4887/4883: symbols only reachable via docker/docker
          # package init (client SDK). The actual vulnerable code (docker cp,
          # AuthZ plugin validation) lives in the dockerd daemon, which we never
          # call — no fix exists upstream for the client module. Allowlisted
          # until moby/moby ships a fixed docker/docker release.
          ALLOWED_VULNS="GO-2026-5668 GO-2026-5617 GO-2026-4887 GO-2026-4883"
          govulncheck -json ./... > govulncheck.json || true
          FOUND=$(jq -r 'select(.osv != null) | .osv.id' govulncheck.json | sort -u)
          UNEXPECTED=""
          for id in $FOUND; do
            case " $ALLOWED_VULNS " in
              *" $id "*) ;;
              *) UNEXPECTED="$UNEXPECTED $id" ;;
            esac
          done
          if [ -n "$FOUND" ]; then
            echo "Vulnerabilities found: $FOUND"
          fi
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unallowed vulnerabilities found:$UNEXPECTED"
            exit 1
          fi

      - name: Build server binary
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/wireops .

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Run postinstall scripts
        working-directory: ./frontend
        run: npm run postinstall

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm run test

      - name: Run frontend linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run generate
