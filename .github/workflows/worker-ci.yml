name: Worker CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: "1.25.12"

jobs:
  worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-worker-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-worker-
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run worker tests
        env:
          CGO_ENABLED: 0
        run: go test -v ./worker/... ./internal/worker/...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: |
          # GO-2026-5668/5617/4887/4883: symbols only reachable via docker/docker
          # package init (client SDK). The actual vulnerable code (docker cp,
          # AuthZ plugin validation) lives in the dockerd daemon, which we never
          # call — no fix exists upstream for the client module. Allowlisted
          # until moby/moby ships a fixed docker/docker release.
          ALLOWED_VULNS="GO-2026-5668 GO-2026-5617 GO-2026-4887 GO-2026-4883"
          govulncheck -json ./worker/... ./internal/worker/... > govulncheck.json || true
          FOUND=$(jq -r 'select(.osv != null) | .osv.id' govulncheck.json | sort -u)
          UNEXPECTED=""
          for id in $FOUND; do
            case " $ALLOWED_VULNS " in
              *" $id "*) ;;
              *) UNEXPECTED="$UNEXPECTED $id" ;;
            esac
          done
          if [ -n "$FOUND" ]; then
            echo "Vulnerabilities found: $FOUND"
          fi
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unallowed vulnerabilities found:$UNEXPECTED"
            exit 1
          fi

      - name: Build worker binary
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o dist/wireops-worker ./worker/main.go
